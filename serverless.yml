service: dailey-quotes

frameworkVersion: '^3.0.0'

provider:
  name: aws
  runtime: nodejs20.x
  region: il-central-1
  profile: emuna
  environment:
    MONGODB_URI: ${ssm:/dev/MONGODB_URI}
    API_PASSWORD: ${ssm:/dev/API_PASSWORD}
    REGION: il-central-1
    BUCKET: emunabuckil
    PORT: 3000
  iam:
    role: arn:aws:iam::551566338738:role/emuna-lambda-rule

custom:
  # Production runs on the default stage "dev" (the app calls .../dev/save-user-push).
  sendSchedulesEnabled:
    dev: true

package:
  patterns:
    - '!src/**'
    - 'dist/**'
    - 'node_modules/**'
    - 'package.json'
    - 'package-lock.json'

functions:
  api:
    handler: dist/lambda.handler
    events:
      - httpApi:
          path: /quote
          method: get
      - httpApi:
          path: /background
          method: get
      - httpApi:
          path: /admin/quote
          method: post
      - httpApi:
          path: /admin/quote/{id}
          method: put
      - httpApi:
          path: /admin/quote/{id}
          method: delete
      - httpApi:
          path: /quotes
          method: get
      - httpApi:
          path: /quotes/random
          method: get
      - httpApi:
          path: /quotes
          method: post
      - httpApi:
          path: /quotes/author/{id}
          method: get
      - httpApi:
          path: /quotes/{id}
          method: get
      - httpApi:
          path: /quotes/{id}
          method: patch
      - httpApi:
          path: /quotes/{id}
          method: delete
      - httpApi:
          path: /backgrounds
          method: get
      - httpApi:
          path: /backgrounds/notClean
          method: get
      - httpApi:
          path: /backgrounds/clean
          method: get
      - httpApi:
          path: /backgrounds
          method: post
      - httpApi:
          path: /backgrounds/{fileName}
          method: get
      - httpApi:
          path: /backgrounds/{fileName}/clean
          method: patch
      - httpApi:
          path: /backgrounds/{fileName}
          method: delete
      - httpApi:
          path: /authors
          method: get
      - httpApi:
          path: /authors
          method: post
      - httpApi:
          path: /authors/{id}
          method: get
      - httpApi:
          path: /authors/{id}
          method: patch
      - httpApi:
          path: /authors/{id}
          method: delete
      - httpApi:
          path: /app-config
          method: get
      - httpApi:
          path: /app-config
          method: patch
  saveUserPush:
    handler: dist/handlers/saveUserPush.handler
    events:
      - http:
          path: save-user-push
          method: post
          cors: true
  deleteUserPush:
    handler: dist/handlers/deleteUserPush.handler
    events:
      - http:
          path: delete-user-push
          method: post
          cors: true
  # App 2.0+ shows the daily quote locally. This stops the server's daily quote
  # for a device but keeps its token, so broadcast announcements still reach it.
  disableDailyQuote:
    handler: dist/handlers/disableDailyQuote.handler
    events:
      - http:
          path: disable-daily-quote
          method: post
          cors: true
  sendScheduledPushes:
    handler: dist/handlers/sendScheduledPushes.handler
    timeout: 60
    events:
      - schedule:
          rate: cron(0/1 * * * ? *)
          # All stages share the same MongoDB, so only the live stage (dev) may send.
          # When other stages also ran every minute they double-sent quotes and drew Expo 429s.
          enabled: ${self:custom.sendSchedulesEnabled.${sls:stage}, false}
